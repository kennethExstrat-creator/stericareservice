<h2>Reset your SteriCare QC password</h2>
<p>We received a request to reset the password for {{ .Email }}.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">Choose a new password</a></p>
<p>The link works once and expires after a short time. If you did not ask for a reset, you can ignore this email; your password stays the same.</p>
